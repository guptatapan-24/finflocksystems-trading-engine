events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream backend_asgi {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name _;
        server_tokens off;

        root /usr/share/nginx/html;

        # Liveness probe
        location = /healthz {
            proxy_pass http://backend_asgi/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Readiness probe
        location = /readyz {
            proxy_pass http://backend_asgi/readyz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend runtime config
        location = /runtime-config.js {
            try_files /runtime-config.js =404;
            add_header Cache-Control "no-store";
        }

        # Django REST API proxy
        location /api/v1/ {
            proxy_pass http://backend_asgi/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
        }

        # Prometheus metrics
        location = /metrics {
            proxy_pass http://backend_asgi/metrics;
            proxy_set_header Host $host;
        }

        # SPA Frontend client routing
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

