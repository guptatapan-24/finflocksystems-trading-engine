[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
python_files = test_*.py
# gateway/IB_gateway is a separate Django project with its own pytest.ini
# and its own `tests` package. Without this, a bare `pytest` walks into it
# and that second `tests` package shadows this one, so nothing collects.
testpaths = tests
markers =
    docker_integration: requires the real Docker Compose Kafka, Flink, PostgreSQL, Redis, Backend, and paper Gateway services
