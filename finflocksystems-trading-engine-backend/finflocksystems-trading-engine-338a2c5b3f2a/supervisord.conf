; Every worker below runs with --without-gossip --without-mingle
; --without-heartbeat. Nothing in this tree uses Flower, app.control.inspect or
; an app.events consumer, so the worker event stream had no reader: gossip made
; each of the six workers consume the other five's events, and mingle added a
; startup sync round trip per worker. Turning them off removes that fanout
; traffic from the Redis broker entirely.
[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=gunicorn config.asgi:application --worker-class uvicorn_worker.UvicornWorker --bind 0.0.0.0:%(ENV_PORT)s --workers 2 --access-logfile - --forwarded-allow-ips=%(ENV_FORWARDED_ALLOW_IPS)s
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:celery-core]
command=celery -A config worker --loglevel=INFO --concurrency=2 --queues=celery,research_scoring,recommendation_cache,recommendations --hostname=core@%%h --without-gossip --without-mingle --without-heartbeat
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20

[program:celery-data]
command=celery -A config worker --loglevel=INFO --pool=threads --concurrency=%(ENV_RESEARCH_MAX_PARALLEL_DATA_TASKS)s --queues=research_mapping,research_daily_data,research_intraday_data,research_fundamentals,research_events,research_features --hostname=data@%%h --without-gossip --without-mingle --without-heartbeat
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=21

[program:celery-research]
command=celery -A config worker --loglevel=INFO --pool=threads --concurrency=%(ENV_RESEARCH_MAX_PARALLEL_BACKTEST_TASKS)s --queues=research_single_asset,research_cross_sectional,research_allocators,research_overlays,research_pairs --hostname=research@%%h --without-gossip --without-mingle --without-heartbeat
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=22

; strategy_evaluation, target_coordination and intent_execution used to be
; three separate workers at --concurrency=1. Each cost a full interpreter for
; its master process (~180MB resident) on top of its one child, and the three
; masters did nothing but supervise. One worker at --concurrency=3 keeps the
; same three execution slots -- the tasks still run in three separate child
; processes, so a crash or a hang is still isolated to one task -- while paying
; for one master instead of three.
;
; --prefetch-multiplier=1 matters now that three queues share a worker: with
; the default of 4 a child could reserve a backlog of one queue's tasks while
; another queue waits. At 1 a child holds exactly the task it is running.
;
; The trade this accepts: the three slots are now a shared pool, so a burst on
; one queue can occupy slots the other two would previously have had reserved.
; broker_commands is deliberately NOT in this pool -- see below.
[program:celery-trading]
command=celery -A config worker --loglevel=INFO --concurrency=3 --prefetch-multiplier=1 --queues=strategy_evaluation,target_coordination,intent_execution --hostname=trading@%%h --without-gossip --without-mingle --without-heartbeat
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=23

; Kept on its own worker. These are the latency-critical round trips to the
; IBKR gateway; pooling them with the evaluation queues would let a slow
; strategy evaluation occupy the slot an order acknowledgement needs.
[program:celery-broker-commands]
command=celery -A config worker --loglevel=INFO --concurrency=1 --queues=broker_commands --hostname=broker-commands@%%h --without-gossip --without-mingle --without-heartbeat
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=26

[program:beat]
command=celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=30

; Starts the nightly NFO ingestion (Mon-Fri from 22:00 IST) as a SEPARATE low-priority process, so it can never take this container
; down. Idles unless NFO_INGEST_SCHEDULE_ENABLED=true. See ingestionclaude.md section 17.
[program:nfo-ingest-scheduler]
command=python -u manage.py nfo_ingest_scheduler
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=35

[program:market-consumer]
command=python -u manage.py consume_market_streams
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=3
; A database outage makes every restart fail inside startsecs, and supervisord gives up for good
; after startretries (state FATAL, never restarted). Keep trying: a dead consumer silently stops
; all bar storage and every strategy then times out warming up.
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=27

[program:finnhub-market-data]
command=python manage.py consume_finnhub_market_data
autorestart=true
startretries=1000000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=28

; Intelligence layer (advisory only). Own queue and own single-process worker so a slow LLM call can never
; occupy a trading slot. Deliberately NOT one of execution.readiness.REQUIRED_WORKER_ROLES: its absence or
; failure must not block execution readiness.
[program:celery-intelligence]
command=celery -A config worker --loglevel=INFO --concurrency=1 --queues=intelligence --hostname=intelligence@%%h --without-gossip --without-mingle --without-heartbeat
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=24
